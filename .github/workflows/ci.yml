name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: TypeScript validation
        working-directory: ./frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: ./frontend
        run: npm run build

  python-ci:
    name: Run Pytest & Linting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-label: "2026.3"
            python-version: "3.14"
            pytest-ha: "0.13.317"
          - ha-label: "latest"
            python-version: "3.14"
            pytest-ha: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv pip install --system ruff==0.16.0 zeep
          if [ -n "${{ matrix.pytest-ha }}" ]; then
            uv pip install --system "pytest-homeassistant-custom-component==${{ matrix.pytest-ha }}"
          else
            uv pip install --system pytest-homeassistant-custom-component
          fi
      - name: Check formatting
        run: ruff format --check .
      - name: Check linting
        run: ruff check .
      - name: Run tests and coverage
        run: |
          PYTHONPATH=. coverage run -m pytest tests/
          coverage report --fail-under=90
