name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: TypeScript validation
        working-directory: ./frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: ./frontend
        run: npm run build
      - name: Verify reproducible Lovelace bundle
        run: git diff --exit-code custom_components/voipms/frontend/voipms-sms-card.js

  python-ci:
    name: Run Pytest & Linting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-label: "locked"
            python-version: "3.14"
            pytest-ha: "locked"
          - ha-label: "2026.3"
            python-version: "3.14"
            pytest-ha: "0.13.317"
          - ha-label: "latest"
            python-version: "3.14"
            pytest-ha: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: |
          if [ "${{ matrix.pytest-ha }}" = "locked" ]; then
            uv lock --check
            uv sync --locked
          elif [ -n "${{ matrix.pytest-ha }}" ]; then
            uv venv .venv-compat
            uv pip install --python .venv-compat/bin/python ruff==0.17.1 zeep coverage pytest-socket "pytest-homeassistant-custom-component==${{ matrix.pytest-ha }}"
          else
            uv venv .venv-compat
            uv pip install --python .venv-compat/bin/python --upgrade ruff==0.17.1 zeep coverage pytest-socket pytest-homeassistant-custom-component
          fi
      - name: Run pre-commit hooks (locked baseline)
        if: matrix.pytest-ha == 'locked'
        run: uv run --locked pre-commit run --all-files
      - name: Check formatting
        run: |
          if [ "${{ matrix.pytest-ha }}" = "locked" ]; then
            uv run --locked ruff format --check .
          else
            .venv-compat/bin/ruff format --check .
          fi
      - name: Check linting
        run: |
          if [ "${{ matrix.pytest-ha }}" = "locked" ]; then
            uv run --locked ruff check .
          else
            .venv-compat/bin/ruff check .
          fi
      - name: Run tests and coverage
        run: |
          if [ "${{ matrix.pytest-ha }}" = "locked" ]; then
            uv run --locked coverage run -m pytest --disable-socket --allow-unix-socket tests/
            uv run --locked coverage report --fail-under=90
          else
            PYTHONPATH=. .venv-compat/bin/python -m coverage run -m pytest --disable-socket --allow-unix-socket tests/
            .venv-compat/bin/python -m coverage report --fail-under=90
          fi
