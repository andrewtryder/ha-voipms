name: Refresh security lockfile (temporary)

on:
  push:
    branches: [fix/pillow-test-dependencies]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Resolve and verify dependency lock
        run: |
          uv lock --upgrade-package homeassistant --upgrade-package pillow
          uv lock --check
          python - <<'PY'
          import tomllib
          with open("uv.lock", "rb") as file:
              packages = {p["name"]: p["version"] for p in tomllib.load(file)["package"]}
          assert packages["homeassistant"] == "2026.11.3", packages["homeassistant"]
          assert packages["pillow"] == "13.0.0", packages["pillow"]
          assert "pytest-homeassistant-custom-component" not in packages
          print("Home Assistant and Pillow versions verified")
          PY
      - name: Commit generated lockfile to migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): regenerate lockfile for Pillow security update"
            git push origin HEAD:refs/heads/fix/pillow-test-dependencies
          fi
