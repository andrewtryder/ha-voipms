name: Validate with hassfest

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master
