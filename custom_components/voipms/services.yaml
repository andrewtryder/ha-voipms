send_sms:
  name: Send SMS
  description: Send an SMS message through VoIP.MS. Messages longer than 160 characters are rejected and are not split or converted to MMS.
  fields:
    to:
      name: To
      description: Destination phone number in canonical 10-digit NANPA or E.164 format (for example, 5559876543 or +15559876543).
      required: true
      example: "5559876543"
      selector:
        text:
    message:
      name: Message
      description: Text message to send (1–160 characters). Empty and whitespace-only messages are rejected.
      required: true
      example: "Hello from Home Assistant"
      selector:
        text:
          multiline: true
    did:
      name: From DID
      description: Sender DID in canonical 10-digit NANPA or E.164 format. Defaults to the configured Default DID.
      required: false
      example: "5551234567"
      selector:
        text:
